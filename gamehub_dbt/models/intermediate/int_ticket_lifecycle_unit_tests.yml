version: 2

unit_tests:
  - name: test_ticket_lifecycle_reopened
    description: "Verify first and last resolution timestamps and reopening calculations."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - ticket_id: T001

      - input: ref('stg_ticket_events')
        rows:
          - ticket_id: T001
            event_type: created
            event_timestamp: "2026-01-01 10:00:00"

          - ticket_id: T001
            event_type: agent_first_response
            event_timestamp: "2026-01-01 10:30:00"

          - ticket_id: T001
            event_type: resolved
            event_timestamp: "2026-01-01 12:00:00"

          - ticket_id: T001
            event_type: reopened
            event_timestamp: "2026-01-01 13:00:00"

          - ticket_id: T001
            event_type: resolved
            event_timestamp: "2026-01-01 15:00:00"

          - ticket_id: T001
            event_type: reopened
            event_timestamp: "2026-01-01 16:00:00"

          - ticket_id: T001
            event_type: resolved
            event_timestamp: "2026-01-01 18:00:00"

    expect:
      rows:
        - ticket_id: T001
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: "2026-01-01 10:30:00"
          resolved_at: "2026-01-01 12:00:00"
          first_resolved_at: "2026-01-01 12:00:00"
          last_resolved_at: "2026-01-01 18:00:00"
          reopen_count: 2
          reopened_flag: true

  - name: test_ticket_lifecycle_normal
    description: "Verify lifecycle calculations for a ticket that was created, responded to, and resolved without reopening."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - ticket_id: T002

      - input: ref('stg_ticket_events')
        rows:
          - ticket_id: T002
            event_type: created
            event_timestamp: "2026-01-01 10:00:00"

          - ticket_id: T002
            event_type: agent_first_response
            event_timestamp: "2026-01-01 10:30:00"

          - ticket_id: T002
            event_type: resolved
            event_timestamp: "2026-01-01 12:00:00"

    expect:
      rows:
        - ticket_id: T002
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: "2026-01-01 10:30:00"
          resolved_at: "2026-01-01 12:00:00"
          first_resolved_at: "2026-01-01 12:00:00"
          last_resolved_at: "2026-01-01 12:00:00"
          reopen_count: 0
          reopened_flag: false

  - name: test_ticket_lifecycle_multiple_responses
    description: "Ensure that multiple agent responses are correctly handled and the first response timestamp is preserved."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - ticket_id: T003

      - input: ref('stg_ticket_events')
        rows:
          - ticket_id: T003
            event_type: created
            event_timestamp: "2026-01-01 10:00:00"

          - ticket_id: T003
            event_type: agent_first_response
            event_timestamp: "2026-01-01 10:15:00"

          - ticket_id: T003
            event_type: agent_first_response
            event_timestamp: "2026-01-01 10:45:00"

          - ticket_id: T003
            event_type: resolved
            event_timestamp: "2026-01-01 12:00:00"

    expect:
      rows:
        - ticket_id: T003
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: "2026-01-01 10:15:00"
          resolved_at: "2026-01-01 12:00:00"

  - name: test_ticket_lifecycle_unresolved
    description: "Verify lifecycle calculations for an unresolved ticket."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - ticket_id: T004

      - input: ref('stg_ticket_events')
        rows:
          - ticket_id: T004
            event_type: created
            event_timestamp: "2026-01-01 10:00:00"
          - ticket_id: T004
            event_type: agent_first_response
            event_timestamp: "2026-01-01 10:30:00"

    expect:
      rows:
        - ticket_id: T004
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: "2026-01-01 10:30:00"
          resolved_at: null
          first_resolved_at: null
          last_resolved_at: null
          reopen_count: 0
          reopened_flag: false

  - name: test_ticket_lifecycle_orphan_events
    description: "Verify that events without matching tickets are excluded."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - {ticket_id: T001}

      - input: ref('stg_ticket_events')
        rows:
          - {ticket_id: T001, event_type: created, event_timestamp: "2026-01-01 10:00:00"}
          - {ticket_id: T002, event_type: created, event_timestamp: "2026-01-01 11:00:00"}
          - {ticket_id: T002, event_type: resolved, event_timestamp: "2026-01-01 12:00:00"}

    expect:
      rows:
        - ticket_id: T001
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: null
          resolved_at: null
          first_resolved_at: null
          last_resolved_at: null
          reopen_count: 0
          reopened_flag: false

  - name: test_ticket_lifecycle_out_of_order_events
    description: "Verify that lifecycle calculations are independent of input event order."
    model: int_ticket_lifecycle

    given:
      - input: ref('stg_tickets')
        rows:
          - {ticket_id: T001}

      - input: ref('stg_ticket_events')
        rows:
          - {ticket_id: T001, event_type: resolved, event_timestamp: "2026-01-01 15:00:00"}
          - {ticket_id: T001, event_type: reopened, event_timestamp: "2026-01-01 13:00:00"}
          - {ticket_id: T001, event_type: created, event_timestamp: "2026-01-01 10:00:00"}
          - {ticket_id: T001, event_type: resolved, event_timestamp: "2026-01-01 12:00:00"}
          - {ticket_id: T001, event_type: agent_first_response, event_timestamp: "2026-01-01 10:30:00"}

    expect:
      rows:
        - ticket_id: T001
          created_at: "2026-01-01 10:00:00"
          agent_first_response_at: "2026-01-01 10:30:00"
          resolved_at: "2026-01-01 12:00:00"
          first_resolved_at: "2026-01-01 12:00:00"
          last_resolved_at: "2026-01-01 15:00:00"
          reopen_count: 1
          reopened_flag: true