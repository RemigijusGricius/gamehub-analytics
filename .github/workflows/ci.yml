
name: GameHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest Bronze data
        run: python scripts/ingest_bronze.py

      - name: Prepare dbt profile
        run: cp gamehub_dbt/profiles.ci.yml gamehub_dbt/profiles.yml

      - name: Build and test dbt models
        run: |
          dbt build \
            --project-dir gamehub_dbt \
            --profiles-dir gamehub_dbt \
            --profile gamehub_dbt
