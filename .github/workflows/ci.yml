
name: GameHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      GAMEHUB_DB_PATH: ${{ github.workspace }}/gamehub.duckdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest Bronze data
        run: python scripts/ingest_bronze.py

      - name: Verify Bronze ingestion
        run: |
          python -c "import duckdb; con = duckdb.connect('gamehub.duckdb'); print(con.execute('SELECT COUNT(*) FROM bronze.tickets').fetchone())"

      - name: Prepare dbt profile
        run: cp gamehub_dbt/profiles.ci.yml gamehub_dbt/profiles.yml
        
      - name: Install dbt packages
        working-directory: gamehub_dbt
        run: dbt deps


      - name: Prepare incremental model schema
        run: |
          dbt run \
            --select +fct_tickets \
            --empty \
            --project-dir gamehub_dbt \
            --profiles-dir gamehub_dbt \
            --profile gamehub_dbt

      - name: Build and test dbt models
        run: |
          dbt build \
            --project-dir gamehub_dbt \
            --profiles-dir gamehub_dbt \
            --profile gamehub_dbt

      - name: Export Gold tables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/export_gold.py

      - name: Publish Gold artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-gold-tables
          path: data/exports/*.parquet
          if-no-files-found: error
          retention-days: 30